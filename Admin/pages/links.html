<div id="project" class="relative z-0 px-5 py-5 gap-6 flex flex-col items-center justify-around">
    <div class="name border-b-2 border-gray-800 w-full text-center py-2 sticky top-0">
        <h1 class="text-gray-800 font-extrabold text-3xl">Update Links</h1>
    </div>
    <div class="btn w-fit flex items-center absolute right-5 top-6 ">
        <button type="submit" id="newformbtn" class="bg-gray-800 text-white w-max py-2 px-3 rounded-xl cursor-pointer">+
            New
            Link</button>
    </div>

    <!-- display projects -->
    <table class="table-auto border-collapse border border-gray-800 w-full text-left">
        <thead class="bg-gray-100">
            <tr class="border-b text-xl">
                <th class="p-3 border-r text-center w-1/5">ID of</th>
                <th class="p-3 border-r text-center">ID Link</th>
                <th class="p-3 text-center w-1/6">Action</th>
            </tr>
        </thead>
        <tbody id="links"></tbody>
    </table>
</div>

<!-- Form for updating -->
<div id="linkform"
    class="aboutForm temp w-full min-h-screen inset-0 overflow-y-auto overflow-x-hidden fixed z-1000 top-0 hidden items-start justify-center backdrop-blur-sm">

    <!-- logo -->
    <img src="images/svg/logo.svg" class="h-8 px-3 cursor-pointer fixed z-100 top-4 left-3">

    <!-- close -->
    <img src="images/svg/close.svg" id="clsform" class="h-8 px-3 cursor-pointer fixed z-100 top-4 right-3">

    <form action="" style="margin: auto;" class="w-[90%] sm:w-[70%] lg:w-[60%] 
         p-5 border-2 rounded-2xl 
         flex flex-col items-center gap-4 
         bg-white box-border min-w-0">

        <!-- Name -->
        <div class="w-full flex flex-col items-start gap-1">
            <label class="text-[14px] px-3">Link Name</label>
            <input type="text" id="linkname"
                class="forminput bg-white w-full min-w-0 py-2 px-3 border-2 rounded-xl outline-none box-border"
                placeholder="Link name...">
        </div>

        <!-- Link -->
        <div class="w-full flex flex-col items-start gap-1">
            <label class="text-[14px] px-3">Link</label>
            <input type="text" id="linkurl"
                class="forminput bg-white w-full min-w-0 py-2 px-3 border-2 rounded-xl outline-none box-border"
                placeholder="Link...">
        </div>

        <!-- Button -->
        <div class="w-full flex items-center justify-center">
            <button id="btn" type="submit" class="bg-gray-800 text-white py-2 px-3 rounded-xl cursor-pointer"></button>
        </div>
    </form>

</div>
