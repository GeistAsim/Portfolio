<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asim Saifi</title>
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/utility.css">
    <link rel="stylesheet" href="CSS/responsive.css">
</head>

<body>
    <!-- Intro section -->
    <div class="body flex">

        <div class="hero flex">
            <!-- header section -->
            <nav class="flex">

                <!-- logo section -->
                <div class="logo flex">
                    <img src="images/svg/logo.svg" alt="Asim Saifi">
                    <span>Asim Saifi</span>
                    <div class="border-1">
                    </div>
                </div>

                <!-- nav bar menu section -->
                <div class="nav-right flex">
                    <div class="r-left flex">
                        <div class="hello">
                            <div>
                                _hello
                            </div>
                        </div>
                        <div class="hello">
                            <div>
                                _about-me
                            </div>
                        </div>
                        <div class="hello">
                            <div>
                                _projects
                            </div>
                        </div>
                    </div>
                    <div class="r-right flex">
                        <dic class="contact flex">
                            _contact-me
                        </dic>
                    </div>
                </div>
            </nav>

            <!-- main -->
            <div class="container flex">
                <div class="side flex">
                    <div class="file">
                        <div class="about flex">
                            <div class="about-1 flex">
                                <img src="images/svg/down_arrow.svg" alt="" class="direct">
                                <div>Contacts</div>
                            </div>
                            <div class="border-2"></div>
                        </div>
                        <div class="mail flex">
                            <div class="mail-1 flex">
                                <img src="images/svg/mail.svg" alt="E-Mail" class="direct">
                                <span>asimsaifioffical12@gmail.com</span>
                            </div>
                            <div class="mail-1 flex">
                                <img src="images/svg/phone.svg" alt="E-Mail" class="direct">
                                <span>+91 9024714087</span>
                            </div>
                        </div>
                    </div>
                    <div class="border-1">
                    </div>
                </div>
                <div class="me me-about flex">
                    <div class="see">
                        <form action="" class="form flex">
                            <div class="form-box flex">
                                <div class="frm-ele flex">
                                    <label for="name" class="lbl">_name:</label>
                                    <input type="text" name="name" class="person-1" autocomplete="off" required>
                                </div>
                                <div class="frm-ele flex">
                                    <label for="name" class="lbl">_email:</label>
                                    <input type="email" name="name" class="person-1" autocomplete="off" required>
                                </div>
                                <div class="frm-ele flex">
                                    <label for="name" class="lbl">_message</label>
                                    <textarea type="text" name="name" class="person-1 message"
                                            placeholder="Your message here..." required></textarea>
                                </div>
                                <button class="btn" id="submit-msg">
                                    Submit-Message
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <footer class="flex">
                <div class="foot-right flex">
                    <div class="r-left flex">
                        <div class="hello">
                            find me in:
                        </div>
                        <div class="hello">
                            <a class="foot-1 flex" href="https://www.linkedin.com/in/asim-saifi" target="_blank">
                                <img src="images/svg/linkedin.svg" alt="Linkedin">
                            </a>
                        </div>
                        <div class="hello">
                            <a class="foot-1 flex" href="https://www.instagram.com/asimsaifioffical/" target="_blank">
                                <img src="images/svg/insta.svg" alt="Instagram">
                            </a>
                        </div>
                        <div class="hello">
                            <a class="foot-1 flex" href="https://www.instagram.com/asimsaifioffical/" target="_blank">
                                <img src="images/svg/up-work.svg" alt="Up Work">
                            </a>
                        </div>
                        <div class="hello">
                            <a class="foot-1 flex" href="https://www.instagram.com/asimsaifioffical/" target="_blank">
                                <img src="images/svg/fiverr.svg" alt="Fiverr">
                            </a>
                        </div>
                    </div>
                    <div class="r-right flex">
                        <dic class="contact flex">
                            <a class="foot-1 flex" href="https://github.com/asimsaifioffical" target="_blank">
                                <span>@asimsaifioffical</span>
                                <img src="images/svg/github.svg" alt="GitHub">
                            </a>
                        </dic>
                    </div>
                </div>
            </footer>
        </div>
    </div>
</body>

</html>
